<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rwanda Yield Gap Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: NISR-blue side navigation + two columns. On desktop (>= 1100px) the left column (title, filters, in brief,
   map) is fixed to the viewport and the right column (KPIs, charts) scrolls on its own; below that the page is one
   scrolling column. One deliberate light theme: blues on white, like statistics.gov.rw. */
:root {
  --nisr: #0b4ea2;        /* NISR blue: navigation, primary marks */
  --nisr-dark: #083a7a;
  --sky: #a9d3f2;         /* NISR light blue */
  --pale: #eaf3fc;        /* tints, selected rows */
  --bg: #f4f8fd;          /* page */
  --panel: #ffffff;
  --ink: #0d2b4e;         /* text: deep navy */
  --muted: #5b7290;
  --line: #dbe5f1;
  --accent: #1f5fae;      /* selected district / key series */
  --grey: #a9c4e2;        /* comparison series, current yield */
  --soil: #0a2f6b;        /* potential gain, targets */
  --good: #1f5fae; --bad: #a9c4e2;
  --shadow: 0 1px 3px rgba(11, 78, 162, .08);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nisr); }
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
aside.side { background: var(--nisr); color: #fff; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 22px 14px 18px max(14px, env(safe-area-inset-left, 0px)); }
.logo { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.logo svg { flex: none; }
.logo b { font: 800 16px/1.15 var(--f-display); display: block; }
.logo small { display: block; font-size: 11.5px; color: #cfe4f7; line-height: 1.3; margin-top: 2px; }
nav.tabs { display: flex; flex-direction: column; gap: 2px; }
nav.tabs a, nav.tabs .ask-nav { display: flex; gap: 10px; align-items: center; text-decoration: none; color: #dcebfa; font: 600 14.5px var(--f-body); padding: 9px 12px; border-radius: 8px; }
nav.tabs a svg { flex: none; opacity: .9; }
nav.tabs a:hover, nav.tabs .ask-nav:hover { background: rgba(255, 255, 255, .08); color: #fff; }
/* the data assistant opens from the menu; set apart from the page tabs by a thin rule */
nav.tabs .ask-nav { width: 100%; border: 0; margin-top: 8px; background: rgba(255, 255, 255, .12); cursor: pointer; text-align: left; position: relative; }
nav.tabs .ask-nav::before { content: ""; position: absolute; left: 6px; right: 6px; top: -6px; border-top: 1px solid rgba(255, 255, 255, .25); }
nav.tabs .ask-nav[aria-expanded="true"] { background: #fff; color: var(--nisr); }
nav.tabs a[aria-current="page"] { background: #fff; color: var(--nisr); }
.side .grow { flex: 1; }
.lang { display: flex; border: 1px solid rgba(255, 255, 255, .35); border-radius: 999px; overflow: hidden; margin: 0 6px; }
.lang button { flex: 1; border: 0; background: none; color: #dcebfa; font: 600 12.5px var(--f-body); padding: 7px 8px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: #fff; color: var(--nisr); }
.side .src { font-size: 11.5px; color: #cfe4f7; padding: 0 6px; line-height: 1.4; }
.main { min-width: 0; }
.col { min-width: 0; padding: max(16px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 16px 20px; }
#map-col { display: flex; flex-direction: column; gap: 12px; }
#stats-col { display: grid; gap: 16px; align-content: start; padding-top: 16px; }
header.bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: end; justify-content: space-between; }
header.bar h1 { font: 800 21px/1.2 var(--f-display); margin: 0; color: var(--ink); text-wrap: balance; }
header.bar p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
select { font: 600 14px var(--f-body); color: var(--ink); background: var(--pale); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 60vw; }
select:focus-visible, button:focus-visible, a:focus-visible, .tile:focus-visible { outline: 2px solid var(--nisr); outline-offset: 2px; }
section.view { display: grid; gap: 14px; min-width: 0; }
.lead { font-size: 16.5px; max-width: 85ch; margin: 0; }
.lead b { color: var(--nisr); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.kpi .ic { grid-row: 1 / span 3; grid-column: 2; width: 36px; height: 36px; border-radius: 10px; background: var(--pale); color: var(--nisr); display: grid; place-items: center; }
.kpi .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.kpi .v { font: 700 25px/1.2 var(--f-display); font-variant-numeric: tabular-nums; color: var(--ink); }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.up { color: var(--nisr); } .down { color: var(--muted); }
.brief { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; box-shadow: var(--shadow); display: grid; gap: 8px; align-content: start; }
.brief-k { font: 700 12px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--nisr); display: flex; align-items: center; gap: 8px; }
.brief-k::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--nisr); }
.brief p { margin: 0; font-size: 16px; line-height: 1.55; max-width: 80ch; }
.brief p.headline { font: 700 20px/1.3 var(--f-display); color: var(--nisr); }
.brief p.muted { font-size: 14.5px; color: var(--muted); }
.brief b { color: var(--nisr); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 16px; box-shadow: var(--shadow); min-width: 0; }
.panel.map { padding: 16px 18px 14px; }
.panel h2 { font: 700 16px/1.3 var(--f-display); margin: 0 0 2px; text-wrap: balance; }
.panel h3 { font: 700 14px/1.3 var(--f-display); margin: 0 0 4px; }
.panel .sub { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--f-body); fill: var(--muted); font-size: 12px; }
.chart .val { font-family: var(--f-data); font-size: 11.5px; fill: var(--ink); }
.chart .lbl { fill: var(--ink); font-size: 12.5px; }
.chart .hl { font-weight: 700; fill: var(--ink); }
.mapbox svg { max-height: 640px; }
.tile { cursor: pointer; }
.tile rect, .tile path { stroke: #000; stroke-width: .9; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: opacity .15s; }
.tile:hover path, .tile:hover rect { opacity: .85; }
.tile.sel rect, .tile.sel path { stroke: #000; stroke-width: 2.6; }
/* map labels: dark text with a white halo, readable on every fill */
.maplbl { fill: #0d2b4e; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 6px; align-items: center; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.legend i.line { height: 3px; vertical-align: 3px; border-radius: 2px; }
.ramp { display: inline-block; width: 160px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #eaf3fc, #0a3d8f); vertical-align: middle; margin: 0 6px; }
.levers { display: flex; flex-wrap: wrap; gap: 6px; }
.levers button { font: 600 13.5px var(--f-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.levers button[aria-pressed="true"] { background: var(--nisr); border-color: var(--nisr); color: #fff; }
.levers button:disabled { opacity: .45; cursor: not-allowed; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
td.n, th.n { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
tr.sel td { background: var(--pale); }
tbody tr { cursor: pointer; }
.tablewrap { overflow-x: auto; max-height: 520px; overflow-y: auto; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; }
.p-high { background: #0a3d8f; color: #fff; } .p-medium { background: #4a90d9; color: #fff; } .p-low { background: #cfe4f7; color: var(--nisr-dark); } .p-none { background: #eef3f8; color: var(--muted); }
.pill.warn { background: var(--pale); color: var(--nisr); }
.reccard { display: grid; gap: 10px; }
.reccard .act { font: 700 18px/1.3 var(--f-display); color: var(--nisr); margin: 0; }
.reccard p { margin: 0; }
.reccard .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.prose { max-width: 80ch; width: 100%; margin-inline: auto; }
.prose h2 { font: 700 18px var(--f-display); margin: 18px 0 6px; }
.prose p, .prose li { margin: 6px 0; }
#tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: #fff; font-size: 12.5px; line-height: 1.35; padding: 7px 10px; border-radius: 8px; max-width: 280px; opacity: 0; transition: opacity .1s; box-shadow: 0 4px 14px rgba(13, 43, 78, .25); }
.empty { color: var(--muted); font-style: italic; padding: 16px 0; }
footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-block: 14px 12px; }
/* Desktop: the window does not scroll; the map column is fixed and fits the map, the statistics column scrolls. */
@media (min-width: 1100px) {
  html, body { height: 100%; overflow: hidden; }
  .app { height: 100vh; height: 100dvh; min-height: 0; }
  aside.side { height: 100vh; height: 100dvh; }
  .main { height: 100vh; height: 100dvh; min-height: 0; }
  .cols { display: grid; grid-template-columns: minmax(0, 58fr) minmax(0, 42fr); height: 100%; min-height: 0; }
  #map-col { height: 100%; min-height: 0; overflow: hidden; background: var(--panel); border-right: 1px solid var(--line); padding-right: 18px; }
  #stats-col { height: 100%; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-left: 18px; }
  #map-view { display: flex; flex-direction: column; gap: 10px; flex: 1 1 0; min-height: 0; }
  #map-view > * { flex: none; }
  #map-view .panel.map { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; box-shadow: none; padding: 10px 12px 8px; }
  #map-view .panel.map h2 { font-size: 15px; }
  #map-view .panel.map .sub { font-size: 12.5px; margin-bottom: 4px; }
  #map-view .panel.map .note { font-size: 11.5px; margin-top: 4px; }
  #map-view .mapbox + .note { display: none; } /* boundary file name: in the README */
  header.bar { flex-direction: column; align-items: stretch; gap: 8px; }
  .filters { flex-wrap: wrap; gap: 8px 10px; }
  .filters .field { flex: 1 1 105px; }
  .filters select { width: 100%; max-width: none; font-size: 13px; padding: 6px 8px; text-overflow: ellipsis; }
  #map-view .panel.map > * { flex: none; }
  #map-view .panel.map > .mapbox { flex: 1 1 0; min-height: 0; }
  #map-view .mapbox svg { width: 100%; height: 100%; max-height: none; max-width: none !important; }
  .levers button { font-size: 12.5px; padding: 4px 11px; }
  #stats-col .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  #stats-col .kpi .v { font-size: 22px; }
  /* About: one centred, scrolling text column */
  .cols.full { grid-template-columns: minmax(0, 1fr); }
  .cols.full #map-col { overflow-y: auto; border-right: 0; background: var(--bg); }
  .cols.full #map-view { display: block; flex: none; }
}
@media (min-width: 1100px) and (max-height: 900px) { header.bar p { display: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside.side { position: static; height: auto; flex-direction: column; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  nav.tabs { flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  nav.tabs a, nav.tabs .ask-nav { flex: none; width: auto; padding: 7px 10px; font-size: 13.5px; }
  nav.tabs .ask-nav { margin-top: 0; }
  nav.tabs .ask-nav::before { display: none; }
  nav.tabs a svg, .side .grow, .side .src { display: none; }
  .lang { margin: 0; max-width: 220px; }
  .col { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
/* "Ask the data" assistant (docs/assistant.js) */
#ask-panel { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100vw; padding-right: env(safe-area-inset-right, 0px); display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(13, 43, 78, .18); overflow: hidden; }
#ask-panel[hidden] { display: none; }
.ask-head { display: flex; align-items: center; justify-content: space-between; padding: max(10px, env(safe-area-inset-top, 0px)) 12px 10px 16px; background: var(--nisr); color: #fff; font: 700 15.5px var(--f-display); }
#ask-close { border: 0; background: none; color: #fff; font-size: 24px; line-height: 1; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; }
#ask-close:hover { background: rgba(255, 255, 255, .15); }
#ask-log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.ask-msg { max-width: 92%; padding: 8px 11px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
.ask-msg p { margin: 0; }
.ask-msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.ask-msg.me { align-self: flex-end; background: var(--nisr); color: #fff; }
.ask-go { margin-top: 6px; border: 0; background: none; padding: 0; color: var(--nisr); font: 700 13px var(--f-body); cursor: pointer; text-decoration: underline; }
.ask-sugg, #ask-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.ask-sugg { margin-top: 6px; }
#ask-chips { padding: 8px 10px 4px; border-top: 1px solid var(--line); max-height: 92px; overflow-y: auto; }
.ask-chip { border: 1px solid var(--line); background: var(--pale); color: var(--nisr-dark); border-radius: 999px; padding: 3px 10px; font: 600 12.5px var(--f-body); cursor: pointer; text-align: left; }
.ask-chip:hover { border-color: var(--nisr); }
#ask-form { display: flex; gap: 6px; padding: 8px 10px 10px; }
#ask-in { flex: 1; min-width: 0; font: 15px var(--f-body); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
#ask-in:focus-visible { outline: 2px solid var(--nisr); outline-offset: 0; }
#ask-send { border: 0; border-radius: 10px; background: var(--nisr); color: #fff; font: 700 14px var(--f-body); padding: 0 14px; cursor: pointer; }
@media (max-width: 640px) {
  #ask-panel { top: auto; left: 0; width: 100%; height: 85vh; height: 85dvh; border-left: 0; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
@media (prefers-reduced-motion: reduce) { #tip, .tile path, .tile rect { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#fff"/><path d="M6 25c4-7 8-10 11-10s6 2 11-4" fill="none" stroke="#0b4ea2" stroke-width="2.6" stroke-linecap="round"/><path d="M6 28h22" stroke="#a9d3f2" stroke-width="2.6" stroke-linecap="round"/><circle cx="17" cy="15" r="2.6" fill="#0b4ea2"/></svg>
      <div><b data-t="nav_title">Yield Gap Explorer</b><small data-t="nav_sub">NISR Big Data Hackathon 2026 · Track 1</small></div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#trends" data-tab="trends"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span data-t="tab_trends">Yield trends</span></a>
      <a href="#actions" data-tab="actions"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span data-t="tab_actions">What to do</span></a>
      <a href="#drivers" data-tab="drivers"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="tab_drv">What drives yield</span></a>
      <a href="#model" data-tab="model"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg><span data-t="tab_model">How reliable</span></a>
      <a href="#about" data-tab="about"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-t="tab_about">About</span></a>
      <button type="button" id="ask-btn" class="ask-nav" aria-expanded="false" aria-controls="ask-panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4"/></svg><span id="ask-btn-t">Ask AI</span></button>
    </nav>
    <div class="grow"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">English</button>
      <button type="button" id="lang-rw" aria-pressed="false">Kinyarwanda</button>
    </div>
    <div class="src">Data: NISR Seasonal Agricultural Survey · satellite (Earth Engine) · MINAGRI PSTA 5</div>
  </aside>
  <div class="main">
    <main class="cols" id="cols">
      <div class="col" id="map-col">
        <header class="bar">
          <div><h1 id="page-title">Rwanda Yield Gap Explorer</h1><p data-t="subtitle">Where fertilizer, improved seed and manure would raise harvests most</p></div>
          <div class="filters">
            <div class="field"><label for="f-crop" data-t="crop">Crop</label><select id="f-crop"></select></div>
            <div class="field"><label for="f-season" data-t="season">Season</label><select id="f-season"></select></div>

          </div>

        <section class="view" id="map-view"></section>

      <div class="col" id="stats-col">

        <footer id="foot"></footer>
      </div>

  </div>
</div>
<div id="tip" role="tooltip"></div>
<noscript><p>This dashboard needs JavaScript.</p></noscript>
<script src="districts.js" onerror="this.remove()"></script>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DASH;

/* ------------------------------------------------------------------ language */
const TXT = {
  en: {
    title: "Rwanda Yield Gap Explorer",
    subtitle: "Where fertilizer, improved seed and manure would raise harvests most",
    crop: "Crop", season: "Season", district: "District", baseline: "Baseline year",
    tab_trends: "Yield trends", tab_scen: "Yield gap & scenarios", tab_drv: "What drives yield", tab_model: "How reliable", tab_about: "About",
    seasonA: "Season A (Sep–Feb)", seasonB: "Season B (Mar–Jun)",
    kgha: "kg/ha", t: "t", national_avg: "Average of all districts", range: "Range across districts",
    yield_trend: "Yield trend", from_to: "from {a} to {b}",
    trend_sub: "NISR published district yields (Seasonal Agricultural Survey), kg/ha",

/* ------------------------------------------------------------------ recommendations (scenario-based) */
const SINGLE = ["fertilizer", "improved_seed", "manure", "lime", "anti_erosion"];
function recFor(d, crop, season) {
  const rows = SCEN.filter(r => r.district === d && r.crop === crop && r.season === season && r.plots >= 20);
  const singles = rows.filter(r => SINGLE.includes(r.scenario) && r.yield_gain_pct >= 1 && r.extra_production_t > 0.5).sort((a, b) => b.extra_production_t - a.extra_production_t);
  return { best: singles[0] || null, next: singles[1] || null, pkg: rows.find(r => r.scenario === "package_fert_seed_manure") || null, any: rows.length > 0 };
}
function recsAll(crop, season) {
  const out = {};
  DISTRICTS.forEach(d => { out[d] = recFor(d, crop, season); });
  const ranked = DISTRICTS.filter(d => out[d].best).sort((a, b) => out[b].best.extra_production_t - out[a].best.extra_production_t);
  ranked.forEach((d, i) => { out[d].tier = i < ranked.length / 3 ? "high" : i < 2 * ranked.length / 3 ? "medium" : "low"; });
  DISTRICTS.forEach(d => { if (!out[d].tier && out[d].any) out[d].tier = "none"; });
  return out;
}
function recText(r, crop) {
  if (!r.best) return tr("r_none");
  const b = r.best;
  return tr("r_" + b.scenario, { crop: esc(cropName(crop)), adopt: nf(b.adoption_pct), gain: nf(b.yield_gain_pct, 1), t: nf(b.extra_production_t) });
}
function pkgText(r, crop) {
  if (!r.pkg) return "";
  const t = TARGETS[crop], att = r.pkg.attainable_yield_kg_ha;
  return tr("pkg_line", { gain: nf(r.pkg.yield_gain_pct, 1), att: nf(att), target: t ? tr("tgt_part", { p: nf(100 * att / t) }) : "" });
}


/* ------------------------------------------------------------------ small helpers for the plain-language views */
const ord = n => { if (LANG === "rw") return String(n); const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const signPct = v => (v >= 0 ? "+" : "−") + nf(Math.abs(v)) + "%";
const listNames = arr => arr.join(", ");
const brief = (title, html) => `<div class="brief"><div class="brief-k">${title}</div>${html}</div>`;
const seasonShort = s => (LANG === "rw" ? "Igihembwe " : "Season ") + s;
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;

/* horizontal bars of yield (kg/ha) with a vertical target line */
function yieldBars(items, target, { labelW = 210, width = 600 } = {}) {
  if (!items.length) return `<p class="empty">${tr("noData")}</p>`;
  const W = width, R = 110, rowH = 30, T = target ? 22 : 4, H = items.length * rowH + T + 4;
  const mx = Math.max(...items.map(i => i.v), target || 0) * 1.02, X = v => labelW + v / mx * (W - labelW - R);
  let g = "";
  if (target) g += `<line x1="${X(target)}" x2="${X(target)}" y1="${T - 6}" y2="${H}" stroke="var(--soil)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${X(target)}" y="${T - 10}" text-anchor="middle" style="fill:var(--soil);font-size:11.5px;font-weight:700">${tr("psta")}: ${nf(target)}</text>`;
  items.forEach((it, i) => {
    const y = T + i * rowH;
    g += `<g data-tip="${esc(it.tip || "")}"><text x="${labelW - 10}" y="${y + rowH / 2 + 3}" text-anchor="end" class="lbl ${it.strong ? "hl" : ""}">${esc(it.label)}</text>`
      + `<rect x="${labelW}" y="${y + 5}" width="${Math.max(1, X(it.v) - labelW)}" height="${rowH - 12}" rx="3" fill="${it.color}"/>`
      + `<text x="${X(it.v) + 8}" y="${y + rowH / 2 + 3}" class="val">${esc(it.val)}</text></g>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W * 1.15}px" role="img">${g}</svg></div>`;
}

/* ------------------------------------------------------------------ view parts
   Every view returns { map, stats }: map = brief + map (or a large summary chart) for the fixed left column,
   stats = KPIs + all charts for the scrolling right column. stats "" = one full-width column (About). */
const mapPanel = (h, sub, body, legend, data) => `<div class="panel map"><h2>${h}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}${body}${legend ? `<div class="legend">${legend}</div>` : ""}${data ? `<p class="note">${tr("sat_src")}</p>` : ""}</div>`;
const fitChart = html => html.replace('<div class="chart">', '<div class="chart mapbox">'); // a chart that fills the map slot
const kpis = (...cards) => `<div class="kpis">${cards.join("")}</div>`;

/* ------------------------------------------------------------------ 1. Yield trends */
function viewTrends() {
  const rows = seriesFor(S.crop, S.season, S.district), nat = natSeries(S.crop, S.season), tgt = TARGETS[S.crop];
  const b = baseVal(rows, S.base), last = rows.at(-1);
  const chg = b && last ? 100 * (last.yield_kg_ha / b.yield_kg_ha - 1) : null;
  const nb = baseVal(nat.map(n => ({ year: n.year, yield_kg_ha: n.mean })), S.base), nl = nat.at(-1);
  const natChg = nb && nl ? 100 * (nl.mean / nb.yield_kg_ha - 1) : null;
  const peers = last ? trendRows(S.crop, S.season).filter(r => r.year === last.year).sort((a, c) => c.yield_kg_ha - a.yield_kg_ha) : [];
  const rank = peers.findIndex(r => r.district === S.district) + 1;
  // map values: change since baseline
  const vals = {};
  DISTRICTS.forEach(d => { const rr = seriesFor(S.crop, S.season, d), bb = baseVal(rr, S.base), ll = rr.at(-1); if (bb && ll && ll.year > bb.year) vals[d] = 100 * (ll.yield_kg_ha / bb.yield_kg_ha - 1); });
  const order = Object.entries(vals).sort((a, c) => c[1] - a[1]);
  const ups = order.slice(0, 3).map(([d, v]) => `${d} (${signPct(v)})`), downs = order.slice(-2).reverse().filter(([, v]) => v < 0).map(([d, v]) => `${d} (${signPct(v)})`);
  // inputs (latest survey year)
  const ad = ADOPT.filter(r => r.crop === S.crop && r.season === S.season), ay = Math.max(...ad.map(r => r.year));
  const da = ad.find(r => r.district === S.district && r.year === ay), na = ad.find(r => r.district === "Rwanda" && r.year === ay);
  // brief text
  let txt = "";
  if (b && last) {
    txt += `<p>${tr("t_s1", { crop: esc(cropName(S.crop)), d: S.district, season: seasonShort(S.season), b: nf(b.yield_kg_ha), by: b.year, l: nf(last.yield_kg_ha), ly: last.year, chg: tr(chg >= 0 ? "t_up" : "t_down", { p: nf(Math.abs(chg)) }), nchg: natChg == null ? "–" : signPct(natChg) })}`;
    txt += " " + tr("t_s2", { d: S.district, rank: ord(rank), n: peers.length }) + (tgt ? tr("t_s2t", { p: nf(100 * last.yield_kg_ha / tgt), t: nf(tgt) }) : ".") + "</p>";
  } else txt += `<p>${tr("noData")}</p>`;
  if (da && na) txt += `<p>${tr("t_s3", { f: nf(100 * da.fert), s: nf(100 * da.seed), m: nf(100 * da.manure), nf: nf(100 * na.fert), ns: nf(100 * na.seed), nm: nf(100 * na.manure), y: ay })}</p>`;
  if (order.length) txt += `<p class="muted">${tr("t_map", { a: S.base, up: listNames(ups), down: downs.length ? listNames(downs) : "–" })}</p>`;
  const vs = Object.values(vals), lo = Math.min(...vs), hi = Math.max(...vs);
  const map = districtMap(vals, {
    color: v => ramp((v - lo) / ((hi - lo) || 1)), sub: (d, v) => signPct(v),
    tipFor: (d, v) => { const rr = seriesFor(S.crop, S.season, d), ll = rr.at(-1); return `<b>${d}</b><br>${v == null ? tr("noData") : signPct(v) + (ll ? ` · ${nf(ll.yield_kg_ha)} ${tr("kgha")} (${ll.year})` : "")}`; }
  });
  const xs = YEARS.filter(y => nat.some(n => n.year === y));
  const lc = lineChart({
    xs, band: nat.map(n => ({ x: n.year, lo: n.lo, hi: n.hi })), width: 620, height: 300,
    refs: tgt ? [{ y: tgt, label: tr("psta"), tip: `<b>${tr("psta")}</b><br>${nf(tgt)} ${tr("kgha")}` }] : [],
    series: [
      { color: "var(--grey)", width: 2, dash: true, label: tr("national_avg"), pts: nat.map(n => ({ x: n.year, y: n.mean, tip: `<b>${tr("national_avg")}</b><br>${n.year}: ${nf(n.mean)} ${tr("kgha")}` })) },
      { color: "var(--nisr)", width: 3, label: S.district, pts: rows.map(r => ({ x: r.year, y: r.yield_kg_ha, hollow: !!r.flag, tip: `<b>${S.district}</b><br>${r.year}: ${nf(r.yield_kg_ha)} ${tr("kgha")}` })) }
    ]
  });
  // input use: district vs Rwanda
  const use = da && na ? ["fert", "seed", "manure"].flatMap(k => [
    { label: tr(k), v: 100 * da[k], color: "var(--nisr)", strong: true, val: pct(100 * da[k]), tip: `<b>${S.district}</b> · ${tr(k)}: ${pct(100 * da[k])}` },
    { label: "Rwanda", v: 100 * na[k], color: "var(--grey)", val: pct(100 * na[k]), tip: `<b>Rwanda</b> · ${tr(k)}: ${pct(100 * na[k])}` }]) : [];
  return {
    map: mapPanel(`${tr("change_map")}: ${esc(cropName(S.crop))}, ${esc(seasonName(S.season))}`, tr("click_d"), map,
        `<span>${vs.length ? signPct(lo) : ""}</span><span class="ramp"></span><span>${vs.length ? signPct(hi) : ""}</span>`, true),
    stats: brief(tr("inbrief"), txt) + kpis(
        kpi(tr("k_latest") + (last ? " · " + last.year : ""), last ? nf(last.yield_kg_ha) : "–", tr("kgha"), ICON.up),
        kpi(tr("k_change") + (b ? " · " + tr("since") + " " + b.year : ""), chg == null ? "–" : `<span class="${chg >= 0 ? "up" : "down"}">${signPct(chg)}</span>`, `${tr("national_avg")}: ${natChg == null ? "–" : signPct(natChg)}`, ICON.pct),
        tgt ? kpi(tr("k_target_pct"), last ? nf(100 * last.yield_kg_ha / tgt) + "%" : "–", `${nf(tgt)} ${tr("kgha")}`, ICON.target) : kpi(tr("k_rank"), rank || "–", tr("of30", { n: peers.length }), ICON.flag))
      + `<div class="panel"><h2>${tr("t_chart", { d: S.district })}</h2><p class="sub">${esc(cropName(S.crop))}, ${esc(seasonName(S.season))} · ${tr("kgha")} · NISR SAS</p>${lc}
        <div class="legend"><span><i class="line" style="background:var(--nisr)"></i>${S.district}</span><span><i class="line" style="background:var(--grey)"></i>${tr("national_avg")}</span>${tgt ? `<span><i class="line" style="background:var(--soil)"></i>${tr("psta")}</span>` : ""}</div></div>`
      + `<div class="panel"><h2>${tr("adoption")}: ${S.district}</h2><p class="sub">${tr("adoption_sub")} · ${seasonShort(S.season)} ${isFinite(ay) ? ay : ""}</p>${barChart(use, { labelW: 190, width: 620, maxV: 100 })}
        <div class="legend"><span><i style="background:var(--nisr)"></i>${S.district}</span><span><i style="background:var(--grey)"></i>Rwanda</span></div></div>`
  };
}

/* ------------------------------------------------------------------ 2. What to do (recommendations + input scenarios) */
function viewActions() {
  const mode = S.lever === "best" || leverAvailable(S.lever, S.crop) ? S.lever : "best";
  const pills = ["best"].concat(LEVERS).map(l => { const ok = l === "best" || leverAvailable(l, S.crop), full = l === "best" ? tr("a_best") : tr("lv_" + l);
    return `<button type="button" data-lever="${l}" aria-pressed="${l === mode}" aria-label="${esc(full)}" title="${esc(ok ? full : tr("notScored"))}" ${ok ? "" : "disabled"}>${l === "best" ? tr("a_best_short") : tr("lv_short_" + l)}</button>`; }).join("");
  const R = recsAll(S.crop, S.season), r = R[S.district] || { any: false }, tgt = TARGETS[S.crop];
  const crop = esc(cropName(S.crop)), season = seasonShort(S.season);
  // values per district for the map and the ranking
  let vals = {}, label = {};
  if (mode === "best") DISTRICTS.forEach(d => { if (R[d].best) { vals[d] = R[d].best.extra_production_t; label[d] = tr("lv_short_" + R[d].best.scenario); } else if (R[d].any) { vals[d] = 0; label[d] = "–"; } });
  else SCEN.filter(x => x.crop === S.crop && x.season === S.season && x.scenario === mode && x.plots >= 20).forEach(x => { vals[x.district] = Math.max(0, x.extra_production_t); label[x.district] = nf(x.extra_production_t) + " t"; });
  const top = Object.entries(vals).filter(([, v]) => v > 0.5).sort((a, c) => c[1] - a[1]);
  const top3 = top.slice(0, 3).map(([d]) => d);
  // brief
  let txt = "";
  if (mode === "best") {
    const withRec = DISTRICTS.filter(d => R[d].best), cnt = {};
    withRec.forEach(d => { cnt[R[d].best.scenario] = (cnt[R[d].best.scenario] || 0) + 1; });
    const m = Object.entries(cnt).sort((a, c) => c[1] - a[1])[0];
    txt += `<p class="headline">${r.best ? tr("a_head", { d: S.district, crop, season, lever: tr("lv_" + r.best.scenario).toLowerCase() }) : tr("a_head_none", { d: S.district, crop, season })}</p>`;
    txt += `<p>${r.any ? recText(r, S.crop) : tr("noData")}${r.pkg ? " " + pkgText(r, S.crop) : ""}</p>`;
    if (m) txt += `<p class="muted">${tr("a_nat", { n: m[1], mode: tr("lv_" + m[0]).toLowerCase(), crop, t: nf(withRec.reduce((s, d) => s + R[d].best.extra_production_t, 0)), top: listNames(top3) })}</p>`;
  } else {
    const x = SCEN.find(y => y.crop === S.crop && y.season === S.season && y.scenario === mode && y.district === S.district), n = SNAT.find(y => y.crop === S.crop && y.season === S.season && y.scenario === mode);
    txt += `<p class="headline">${tr("lv_" + mode)}: ${crop}, ${season}</p>`;
    txt += `<p>${x ? tr("a_lev", { d: S.district, lever: tr("lv_" + mode).toLowerCase(), crop, g: nf(x.yield_gain_pct, 1), t: nf(x.extra_production_t), ng: n ? nf(n.yield_gain_pct, 1) : "–", nt: n ? nf(n.extra_production_t) : "–", top: listNames(top3) }) : tr("noData")}</p>`;
  }
  const mx = Math.max(1, ...Object.values(vals));
  const map = districtMap(vals, {
    color: v => v > 0.5 ? ramp(0.15 + 0.85 * Math.sqrt(v / mx)) : NODATA, sub: d => label[d] || "–",
    tipFor: (d, v) => { const q = R[d]; if (v == null) return `<b>${d}</b><br>${tr("noData")}`; if (mode === "best") return q && q.best ? `<b>${d}</b> · ${tr(q.tier)}<br>${tr("lv_" + q.best.scenario)}: +${nf(q.best.yield_gain_pct, 1)}% · ${nf(q.best.extra_production_t)} t` : `<b>${d}</b><br>${tr("none")}`; return `<b>${d}</b><br>${tr("lv_" + mode)}: ${nf(v)} t`; }
  });
  // the selected district's yield today and with each input
  const dr = SCEN.filter(x => x.crop === S.crop && x.season === S.season && x.district === S.district);
  const today = dr.length ? dr[0].current_yield_kg_ha : null;
  const bars = today == null ? [] : [{ label: tr("today"), v: today, color: "var(--grey)", val: nf(today), strong: true, tip: `<b>${tr("today")}</b>: ${nf(today)} ${tr("kgha")}` }]
    .concat(LEVERS.map(l => dr.find(x => x.scenario === l)).filter(Boolean).map(x => ({
      label: tr("lv_" + x.scenario), v: x.attainable_yield_kg_ha, color: x.scenario.startsWith("package") ? "var(--soil)" : (r.best && x.scenario === r.best.scenario) || x.scenario === mode ? "var(--nisr)" : "#7fb0e3",
      strong: (r.best && x.scenario === r.best.scenario) || x.scenario === mode, val: `${nf(x.attainable_yield_kg_ha)} (+${nf(x.yield_gain_pct, 1)}%)`,
      tip: `<b>${tr("lv_" + x.scenario)}</b><br>+${nf(x.yield_gain_pct, 1)}% · ${nf(x.extra_production_t)} t<br>${tr("adopt_col")}: ${pct(x.adoption_pct)}`
    })));
  // top 10 districts
  const topBars = barChart(top.slice(0, 10).map(([d, v]) => ({ label: d, v, color: d === S.district ? "var(--soil)" : "var(--nisr)", strong: d === S.district, val: `${nf(v)} t${mode === "best" ? " · " + label[d] : ""}`, tip: `<b>${d}</b><br>${nf(v)} t` })), { labelW: 120, width: 600, R: 150 });
  const pkg = dr.find(x => x.scenario === "package_fert_seed_manure");
  return {
    map: `<div class="levers" role="group" aria-label="${tr("lever")}">${pills}</div>`
      + mapPanel(mode === "best" ? tr("a_map_best_h", { crop }) : tr("a_map_lev_h", { lever: tr("lv_" + mode) }), mode === "best" ? tr("a_map_best") : tr("a_map_lev"), map,
        `<span>0 t</span><span class="ramp"></span><span>${nf(mx)} t</span>`, true),
    stats: brief(tr("inbrief"), txt) + kpis(
        kpi(tr("k_extra_d", { d: S.district }), mode === "best" ? (r.best ? nf(r.best.extra_production_t) + " t" : "–") : (vals[S.district] != null ? nf(vals[S.district]) + " t" : "–"), `${season} · ${mode === "best" ? (r.best ? tr("lv_" + r.best.scenario) : "") : tr("lv_" + mode)}`, ICON.ton),
        kpi(tr("k_pkg"), pkg ? nf(pkg.attainable_yield_kg_ha) : "–", pkg ? `${tr("today")}: ${nf(pkg.current_yield_kg_ha)} ${tr("kgha")}${tgt ? " · " + nf(100 * pkg.attainable_yield_kg_ha / tgt) + "% " + tr("of_target") : ""}` : "", ICON.target),
        kpi(tr("k_rwanda"), nf(Object.values(vals).reduce((s, v) => s + v, 0)) + " t", `${crop}, ${season}`, ICON.up))
      + `<div class="panel"><h2>${tr("a_bars", { d: S.district, crop })}</h2><p class="sub">${tr("a_bars_sub")}</p>${yieldBars(bars, tgt)}</div>`
      + `<div class="panel"><h2>${tr("a_top")}</h2><p class="sub">${mode === "best" ? tr("a_top_best") : tr("lv_" + mode)}</p>${top.length ? topBars : `<p class="empty">${tr("noData")}</p>`}</div>`
      + `<p class="note">${tr("a_note", { y: D.meta.scenario_year })}</p>`
  };
}

/* ------------------------------------------------------------------ 3. What drives yield */
const GROUPS = ["g_mgmt", "g_weather", "g_plot", "g_soil"];
const groupShares = rows => { const g = {}; rows.forEach(r => { const k = GROUP_KEY[r.group] || "g_weather"; g[k] = (g[k] || 0) + r.share_pct; }); return g; };
function viewDrivers() {

  const mg = cr.filter(r => GROUP_KEY[r.group] === "g_mgmt").sort((a, c) => c.share_pct - a.share_pct)[0];
  const txt = `<p>${tr("d_s", { crop: esc(cropName(S.crop)), mg: nf(g.g_mgmt), w: nf(g.g_weather), p: nf(g.g_plot), s: nf(g.g_soil), f: mg ? "<b>" + esc(featName(mg.feature)).toLowerCase() + "</b>" : "–" })}</p><p class="muted">${tr("d_note")} ${tr("d_sat")}</p>`;
  const feat = barChart(topF.map(r => { const k = GROUP_KEY[r.group] || "g_weather"; return { label: featName(r.feature), v: r.share_pct, color: GROUP_COL[k], strong: k === "g_mgmt", val: pct(r.share_pct, 1), tip: `<b>${featName(r.feature)}</b><br>${tr(k)}: ${pct(r.share_pct, 1)}` }; }), { labelW: 260, width: 640 });
  // summary visual: driver groups, this crop (group colour) vs all crops (pale)
  const groups = barChart(GROUPS.flatMap(k => (crop ? [{ label: tr(k), v: g[k] || 0, color: GROUP_COL[k], strong: true, val: pct(g[k], 0), tip: `<b>${tr(k)}</b><br>${esc(cropName(S.crop))}: ${pct(g[k], 1)}` }] : [])
    .concat([{ label: crop ? tr("allcrops") : tr(k), v: gAll[k] || 0, color: crop ? "#cfdced" : GROUP_COL[k], val: pct(gAll[k], 0), tip: `<b>${tr(k)}</b><br>${tr("allcrops")}: ${pct(gAll[k], 1)}` }])), { labelW: 230, width: 560, rowH: 32, R: 60 });
  return {
    map: mapPanel(tr("drv_groups"), tr("drv_groups_sub", { crop: esc(cropName(S.crop)) }), fitChart(groups),
        GROUPS.map(k => `<span><i style="background:${GROUP_COL[k]}"></i>${tr(k)}</span>`).join("") + (crop ? `<span><i style="background:#cfdced"></i>${tr("allcrops")}</span>` : "")),
    stats: brief(tr("inbrief"), txt) + kpis(
        kpi(tr("g_mgmt"), pct(g.g_mgmt), esc(cropName(S.crop)), ICON.seed),
        kpi(tr("g_weather"), pct(g.g_weather), esc(cropName(S.crop)), ICON.dot),
        kpi(tr("g_soil") + " / " + tr("g_plot").toLowerCase(), pct((g.g_soil || 0) + (g.g_plot || 0)), esc(cropName(S.crop)), ICON.flag))
      + `<div class="panel"><h2>${tr("d_chart", { crop: esc(cropName(S.crop)) })}</h2><p class="sub">${tr("drv_top_sub")}</p>${feat}
        <div class="legend">${GROUPS.map(k => `<span><i style="background:${GROUP_COL[k]}"></i>${tr(k)}</span>`).join("")}</div></div>`
  };
}

/* ------------------------------------------------------------------ 4. How reliable */
function viewModel() {
  const dv = VAL.find(v => v.validation.startsWith("district"));
  const corr = dv ? Object.keys(dv).filter(k => k.startsWith("corr_")).map(k => ({ crop: k.slice(5), v: dv[k] })).filter(x => x.v != null).sort((a, c) => c.v - a.v) : [];
  const w = WF.slice().sort((a, c) => a["MAPE_%"] - c["MAPE_%"]);
  const bestBase = w.find(x => ["last_year", "district_history"].includes(x.model)), bestML = w.find(x => !["last_year", "district_history", "national_mean"].includes(x.model));
  let txt = dv ? `<p>${tr("m_s", { e: nf(100 * dv.district_MAPE_model), b: nf(100 * dv.district_MAPE_baseline), best: corr.slice(0, 2).map(c => esc(cropName(c.crop))).join(", "), worst: corr.slice(-1).map(c => esc(cropName(c.crop))).join(", ") })}</p>` : "";
  if (bestBase && bestML) txt += `<p class="muted">${tr("m_s2", { wf: nf(bestBase["MAPE_%"]), wm: nf(bestML["MAPE_%"]) })}</p>`;
  const isBase = m => ["last_year", "district_history", "national_mean"].includes(m);
  const chart = w.length ? barChart(w.map(x => ({ label: tr("m_" + x.model), v: x["MAPE_%"], color: isBase(x.model) ? "var(--grey)" : "var(--nisr)", val: pct(x["MAPE_%"], 1), tip: `<b>${tr("m_" + x.model)}</b>` })), { labelW: 270, width: 640 }) : "";
  const corrChart = barChart(corr.map(c => ({ label: cropName(c.crop), v: c.v, color: c.crop === S.crop ? "var(--soil)" : "var(--nisr)", strong: c.crop === S.crop, val: nf(c.v, 2), tip: `<b>${esc(cropName(c.crop))}</b><br>r = ${nf(c.v, 2)}` })), { labelW: 190, width: 620, maxV: 1, R: 60 });
  const key = v => v.startsWith("random") ? "v_random" : v.startsWith("district") ? "v_district" : "v_temporal";
  const rowsV = VAL.map(v => `<tr><td>${tr(key(v.validation))}</td><td class="n">${pct(100 * v.district_MAPE_model)}</td><td class="n">${pct(100 * v.district_MAPE_baseline)}</td></tr>`).join("");
  return {
    map: mapPanel(tr("m_chart"), tr("m_chart_sub"), chart ? fitChart(chart) : `<p class="empty">${tr("noData")}</p>`,
        `<span><i style="background:var(--grey)"></i>${tr("m_leg_base")}</span><span><i style="background:var(--nisr)"></i>${tr("m_leg_ml")}</span>`),
    stats: brief(tr("inbrief"), txt) + kpis(
        kpi(tr("v_district"), dv ? pct(100 * dv.district_MAPE_model) : "–", `${tr("v_base")}: ${dv ? pct(100 * dv.district_MAPE_baseline) : "–"}`, ICON.target),
        kpi(tr("k_wf"), bestBase ? pct(bestBase["MAPE_%"]) : "–", bestML ? `${tr("m_" + bestML.model)}: ${pct(bestML["MAPE_%"])}` : "", ICON.up),
        kpi(tr("k_plots"), nf(D.meta.plots), `NISR SAS 2022–2025 · ${esc(D.meta.engine || "")}`, ICON.seed))
      + `<div class="panel"><h2>${tr("v_corr")}</h2><p class="sub">${tr("v_corr_sub")}</p>${corr.length ? corrChart : `<p class="empty">${tr("noData")}</p>`}</div>`
      + `<div class="panel"><h2>${tr("val_table")}</h2><p class="sub">${esc(D.meta.engine || "")} · ${nf(D.meta.plots)} ${tr("plots")}</p>
        <table><thead><tr><th>${tr("v_test")}</th><th class="n">${tr("v_mape")}</th><th class="n">${tr("v_base")}</th></tr></thead><tbody>${rowsV}</tbody></table>
        <p class="note">${tr("m_table_note")}</p></div>`
  };
}

function viewAbout() {
  return { stats: "", map: `<div class="panel prose">${ABOUT[LANG]}<p class="note">${tr("about_rw_note")}</p></div>` };
}
const ABOUT = {
  en: `<h2>What this dashboard is for</h2><p>It helps MINAGRI, RAB and district agronomists decide where to promote fertilizer, improved seed, manure, lime and anti-erosion works, for which crop and season, to raise harvests towards the PSTA 5 targets.</p>
    <h2>How to read it</h2><ul>
      <li><b>Yield trends:</b> how the district's yield moved since a baseline year, compared with the national average and the PSTA 5 target (NISR published yields 2017–2025).</li>

      <li><b>How reliable:</b> how the model was tested.</li>
      <li><b>Ask AI</b> (in the side menu): ask questions in English or Kinyarwanda. It runs in your browser: keyword rules plus a small intent classifier trained on example questions pick the question type, and every number comes from the results shown here. No external AI service is called.</li></ul>
    <h2>Data and method</h2><ul>
      <li>NISR Seasonal Agricultural Survey: published district tables 2017–2026 and plot microdata 2022–2025 (152,835 plot records).</li>
      <li>A LightGBM yield model compares similar fields with and without each input; gains are added up with survey weights per district. Targets: MINAGRI PSTA 5 (2024/25–2028/29).</li></ul>
    <h2>Satellite and geospatial data</h2><p>For every district and season from 2017 to 2026 we extracted, with Google Earth Engine, seasonal anomalies (difference from the district's normal) from: <b>MODIS</b> NDVI/EVI crop greenness (250 m, 16-day) and land surface temperature; <b>CHIRPS</b> rainfall; <b>ERA5-Land</b> soil moisture and air temperature; <b>Sentinel-1</b> radar (10 m). Soil pH, carbon and nitrogen come from <b>iSDAsoil</b>, elevation and slope from <b>SRTM</b>, all inside a consensus cropland mask. These values are joined to the 152,835 surveyed fields. Season weather from satellites explains about 27% of within-crop yield differences, and soil and terrain about 18%.</p>
    <h2>The district-level data challenge</h2><p>NISR's public survey microdata contain no plot GPS coordinates and no sector codes, so satellite, soil and terrain variables can only be attached at district level (one value per district and season). This limits how much plot-to-plot variation the model can explain (within-crop plot R² about 0.13–0.19) and is why results are reported per district. With GPS-linked plots (available to NISR internally), the same pipeline could use field-level satellite data (10 m Sentinel-2/Sentinel-1, terrain wetness, curvature, NDWI) and give field-level recommendations. <b>That is our main recommendation to NISR.</b></p>
    <h2>Limits</h2><ul>
      <li>Gains are estimates from survey data, not field trials; they show where inputs are likely to pay off.</li>
      <li>For a new season, a district's own past yield predicts its yield better than the model: use the model to compare inputs, not to replace the survey.</li>
      <li>An input is shown for a crop only if at least 200 surveyed fields use it and 200 do not. Paddy rice is excluded.</li></ul>
    <h2>Team</h2><p>Rebecca Dukundimana and Jean de Dieu Niyogisubizo, University of Rwanda. NISR Big Data Hackathon 2026, Track 1.</p>
    <h2>Use of AI</h2><p>AI assistance (Claude, Anthropic) was used only to generate code. All code was reviewed, tested and approved by the team. The problem definition, data choices, analysis decisions and interpretation of results are the team's own.</p>`,
  rw: `<h2>Iki gikoresho kigamije iki</h2><p>Gifasha MINAGRI, RAB n'abashinzwe ubuhinzi mu turere guhitamo aho bashyira imbere ifumbire mvaruganda, imbuto z'indobanure, ifumbire y'imborera, ishwagara no kurwanya isuri, ku gihingwa n'igihembwe, kugira ngo umusaruro wegere intego za PSTA 5.</p>

    <h2>Amakuru n'uburyo</h2><ul>
      <li>Ubushakashatsi bwa NISR ku buhinzi bw'ibihembwe: imbonerahamwe z'uturere 2017–2026 n'imibare y'ibanze y'imirima 2022–2025 (imirima 152,835).</li>
      <li>Icyitegererezo cya LightGBM kigereranya imirima isa ikoresha n'idakoresha buri nyongeramusaruro; inyongera zibarwa ku karere hakoreshejwe uburemere bw'ubushakashatsi. Intego: MINAGRI PSTA 5 (2024/25–2028/29).</li></ul>
    <h2>Amakuru y'icyogajuru n'ay'imiterere y'ubutaka</h2><p>Kuri buri karere na buri gihembwe kuva 2017 kugeza 2026, twakoresheje Google Earth Engine dukuramo itandukaniro n'ibisanzwe muri: <b>MODIS</b> (icyatsi cy'ibihingwa NDVI/EVI, m 250, iminsi 16, n'ubushyuhe bw'ubutaka); imvura ya <b>CHIRPS</b>; ubuhehere bw'ubutaka n'ubushyuhe bw'umwuka bya <b>ERA5-Land</b>; radar ya <b>Sentinel-1</b> (m 10). pH, karubone na azote by'ubutaka biva muri <b>iSDAsoil</b>, ubutumburuke n'ubuhaname biva muri <b>SRTM</b>, byose ku butaka buhingwa. Aya makuru yahujwe n'imirima 152,835 yakozweho ubushakashatsi. Ikirere cy'igihembwe (icyogajuru) gisobanura hafi 27% by'itandukaniro ry'umusaruro ku gihingwa kimwe, ubutaka n'imiterere yabwo hafi 18%.</p>
    <h2>Imbogamizi y'amakuru ku rwego rw'akarere</h2><p>Imibare y'ibanze ya NISR iboneka ku mugaragaro ntigira aho imirima iherereye (GPS) cyangwa kode z'imirenge, bityo amakuru y'icyogajuru, ubutaka n'imiterere yabwo ashobora guhuzwa n'imirima ku rwego rw'akarere gusa (agaciro kamwe kuri buri karere n'igihembwe). Ibi bigabanya ubushobozi bw'icyitegererezo bwo gusobanura itandukaniro hagati y'umurima n'undi (R² ku murima, ku gihingwa kimwe, hafi 0.13–0.19), ni yo mpamvu ibisubizo bitangwa ku karere. NISR ifite GPS y'imirima imbere mu kigo; hamwe nayo, uburyo bumwe bwakoresha amakuru y'icyogajuru ku rwego rw'umurima (Sentinel-2/Sentinel-1 ya m 10, ubuhehere bw'imiterere y'ubutaka, imiterere y'ubuso, NDWI) bugatanga inama ku murima. <b>Iki ni cyo cyifuzo cyacu cy'ingenzi kuri NISR.</b></p>

};

/* ------------------------------------------------------------------ controls + routing */
const TABS = ["trends", "actions", "drivers", "model", "about"];
const TAB_KEY = { trends: "tab_trends", actions: "tab_actions", drivers: "tab_drv", model: "tab_model", about: "tab_about" };
function fillControls() {
  const fc = document.getElementById("f-crop"), fs = document.getElementById("f-season"), fd = document.getElementById("f-district"), fb = document.getElementById("f-base");
  fc.innerHTML = CROPS.map(c => `<option value="${c}">${esc(cropName(c))}</option>`).join("");
  fs.innerHTML = ["A", "B"].map(s => `<option value="${s}">${esc(seasonName(s))}</option>`).join("");
  fd.innerHTML = DISTRICTS.map(d => `<option value="${d}">${d} (${esc(D.provinces[d])})</option>`).join("");
  fb.innerHTML = YEARS.slice(0, -1).map(y => `<option value="${y}">${y}</option>`).join("");
  fc.value = S.crop; fs.value = S.season; fd.value = S.district; fb.value = S.base;
}
function applyLang() {
  document.documentElement.lang = LANG === "rw" ? "rw" : "en";
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = tr(el.dataset.t); });
  document.title = tr("title");
  document.getElementById("lang-en").setAttribute("aria-pressed", LANG === "en");
  document.getElementById("lang-rw").setAttribute("aria-pressed", LANG === "rw");
  document.getElementById("foot").textContent = tr("foot", { engine: D.meta.engine || "", date: D.meta.generated });
  fillControls();
}
let shownTab = null;
function render() {
  const mapCol = document.getElementById("map-col"), statsCol = document.getElementById("stats-col");
  const mv = document.getElementById("map-view"), sv = document.getElementById("stats-view");
  const newTab = shownTab !== S.tab, keep = statsCol.scrollTop; shownTab = S.tab;
  document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === S.tab ? "page" : "false"));
  document.getElementById("baseline-field").hidden = S.tab !== "trends";
  document.getElementById("page-title").textContent = tr(TAB_KEY[S.tab]);
  hideTip();
  const v = ({ trends: viewTrends, actions: viewActions, drivers: viewDrivers, model: viewModel, about: viewAbout })[S.tab]();
  mv.innerHTML = v.map; sv.innerHTML = v.stats;
  document.getElementById("cols").classList.toggle("full", !v.stats);
  statsCol.hidden = !v.stats;
  statsCol.scrollTop = newTab ? 0 : keep;
  if (newTab) { mapCol.scrollTop = 0; scrollTo(0, 0); }
  mv.querySelectorAll("[data-lever]").forEach(b => b.addEventListener("click", () => { S.lever = b.dataset.lever; render(); }));
  [mv, sv].forEach(el => { bindTips(el); bindTiles(el); });
  if (typeof Ask !== "undefined") Ask.refresh(); // assistant chips follow the selection and language
}
function route() { const h = location.hash.replace("#", ""); S.tab = TABS.includes(h) ? h : "trends"; render(); }

document.getElementById("f-crop").addEventListener("change", e => { S.crop = e.target.value; render(); });
document.getElementById("f-season").addEventListener("change", e => { S.season = e.target.value; render(); });
document.getElementById("f-district").addEventListener("change", e => { S.district = e.target.value; render(); });
document.getElementById("f-base").addEventListener("change", e => { S.base = +e.target.value; render(); });
document.getElementById("lang-en").addEventListener("click", () => { LANG = "en"; try { localStorage.setItem("yg-lang", LANG); } catch (e) {} applyLang(); render(); });
document.getElementById("lang-rw").addEventListener("click", () => { LANG = "rw"; try { localStorage.setItem("yg-lang", LANG); } catch (e) {} applyLang(); render(); });
addEventListener("hashchange", route);
if (!YEARS.includes(S.base)) S.base = YEARS[0];
applyLang();
route();
</script>
<script src="assistant.js"></script>
</body>
